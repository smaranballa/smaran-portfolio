<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smaran — Redirecting</title>
    <script>
      // GitHub Pages SPA fallback: send deep links back to the app root,
      // then index.html restores the original path via history.replaceState.
      sessionStorage.setItem(
        'spa-redirect',
        location.pathname + location.search + location.hash
      );
      location.replace('/smaran-portfolio/');
    </script>
  </head>
  <body></body>
</html>
